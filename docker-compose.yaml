services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5432:5432"
    volumes:
      - ./marquez_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 3s
      retries: 20
  marquez:
    image: marquezproject/marquez:0.51.0
    container_name: marquez-api
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/marquez
      DB_USER: marquez
      DB_PASSWORD: marquez
    stdin_open: true
    tty: true
  marquez_web:
    image: marquezproject/marquez-web:0.51.0
    container_name: marquez-web
    platform: linux/amd64
    depends_on:
      - marquez
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    stdin_open: true
    tty: true
  
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark
    ports:
      - "4040:4040"
      - "8080:8080"
    depends_on:
      - marquez
    stdin_open: true
    tty: true
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - .:/SparkDataGovernance

  minioserver:
    image: minio/minio:latest
    container_name: minioserver
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION_NAME: us-east-1
      MINIO_REGION: us-east-1 
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data