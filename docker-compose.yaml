services:
  # jupyter notebook with Pyspark
  jupyter_notebook:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter_notebook
    volumes:
      - ./notebooks:/home/notebooks
    ports:
      - "8888:8888"
    depends_on:
      - api

  # Marquez as Openlineage client
  api:
    image: marquezproject/marquez:0.24.0
    container_name: marquez-api
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./docker/wait-for-it.sh:/usr/src/app/wait-for-it.sh
    depends_on:
      - db
    entrypoint: [ "./wait-for-it.sh", "db:5432", "--", "./entrypoint.sh" ]

  # Postgres database for Marquez
  db:
    image: postgres:15.3
    container_name: marquez-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - MARQUEZ_DB=marquez
      - MARQUEZ_USER=marquez
      - MARQUEZ_PASSWORD=marquez
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./postgres_data:/var/lib/postgresql/data

  # Marquez UI
  web:
    image: marquezproject/marquez-web:0.24.0
    container_name: marquez-web
    ports:
      - "3000:3000"
    environment:
      - MARQUEZ_HOST=marquez-api
      - MARQUEZ_PORT=5000
      - WEB_PORT=3000
    stdin_open: true
    tty: true
    depends_on:
      - api
    